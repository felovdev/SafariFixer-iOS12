name: Build and publish Safari Fixer APT repository

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build rootful iOS package
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang git perl python3 curl ca-certificates \
            ldid dpkg-dev fakeroot libssl-dev libplist-dev xz-utils

      - name: Install Theos and iOS SDKs
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -type d -name '*.sdk' -exec cp -R {} "$GITHUB_WORKSPACE/theos/sdks/" \;
          test -n "$(find "$GITHUB_WORKSPACE/theos/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Build Debian package
        run: |
          set -euo pipefail
          make clean package FINALPACKAGE=1
          package="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          mkdir -p dist site/debs
          cp "$package" dist/
          cp "$package" site/debs/
          dpkg-deb --info "$package"

      - name: Generate APT repository metadata
        run: |
          set -euo pipefail
          cd site
          dpkg-scanpackages -m . /dev/null > Packages
          gzip -9 -k Packages
          cat > Release <<'EOF'
          Origin: felovdev
          Label: Safari Fixer
          Suite: stable
          Codename: ios
          Architectures: iphoneos-arm
          Components: main
          Description: Safari Fixer packages for jailbroken legacy iOS
          EOF
          test -s Packages
          test -s Packages.gz
          test -n "$(find debs -maxdepth 1 -type f -name '*.deb' -print -quit)"

      - name: Upload installable package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafariFixer-iOS12-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload APT repository site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Publish APT repository to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/deploy-pages@v4
