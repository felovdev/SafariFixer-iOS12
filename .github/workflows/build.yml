name: Build Safari Fixer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build rootful iOS package
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Theos
        uses: Randomblock1/theos-action@v1
        with:
          theos-dir: theos
          theos-src: https://github.com/theos/theos
          theos-sdks: https://github.com/theos/sdks
          theos-sdks-branch: master

      - name: Build Debian package
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos"
          make clean package FINALPACKAGE=1
          mkdir -p dist
          cp packages/*.deb dist/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SafariFixer-iOS12-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
