name: Build Safari Fixer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build rootful iOS package
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew update
          brew install dpkg ldid xz

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"
          git clone https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          cp -R "$RUNNER_TEMP/theos-sdks/"*.sdk "$GITHUB_WORKSPACE/theos/sdks/"

      - name: Build Debian package
        run: |
          make clean package FINALPACKAGE=1
          mkdir -p dist
          cp packages/*.deb dist/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SafariFixer-iOS12-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
