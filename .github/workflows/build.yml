name: Build Safari Fixer

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build rootful iOS package
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          brew install make dpkg ldid xz
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Install Theos and iOS SDKs
        run: |
          set -euo pipefail
          git clone --recursive https://github.com/theos/theos.git "$GITHUB_WORKSPACE/theos"
          echo "THEOS=$GITHUB_WORKSPACE/theos" >> "$GITHUB_ENV"

          git clone --depth 1 https://github.com/theos/sdks.git "$RUNNER_TEMP/theos-sdks"
          mkdir -p "$GITHUB_WORKSPACE/theos/sdks"
          find "$RUNNER_TEMP/theos-sdks" -maxdepth 1 -type d -name '*.sdk' -exec cp -R {} "$GITHUB_WORKSPACE/theos/sdks/" \;
          test -n "$(find "$GITHUB_WORKSPACE/theos/sdks" -maxdepth 1 -type d -name '*.sdk' -print -quit)"

      - name: Build Debian package
        run: |
          set -euo pipefail
          gmake clean package FINALPACKAGE=1
          mkdir -p dist
          package="$(find packages -maxdepth 1 -type f -name '*.deb' -print -quit)"
          test -n "$package"
          cp "$package" dist/
          dpkg-deb --info "$package"

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: SafariFixer-iOS12-deb
          path: dist/*.deb
          if-no-files-found: error
          retention-days: 14
